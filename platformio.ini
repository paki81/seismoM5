; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stick-c, m5stick-c-plus

[common]
lib_deps = 
	bertmelis/espMqttClient@^1.7.3
	ESP32Async/AsyncTCP@^3.5.0
	ESP32Async/ESPAsyncWebServer@^3.12.1
	bblanchon/ArduinoJson@^7.4.3

[env]
framework = arduino
platform = espressif32@6.12.0
monitor_speed = 115200
upload_speed = 750000
lib_compat_mode = strict
build_flags =
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	-DEMC_ALLOW_NOT_CONNECTED_PUBLISH=0
	-DEMC_PAYLOAD_BUFFER_SIZE=512
	-DEMC_TASK_STACK_SIZE=6144
; Uncomment the following 2 lines for OTA uploading
;upload_port = seismoM5.local
;upload_protocol = espota

[env:m5stick-c]
board = m5stick-c
lib_deps = 
	m5stack/M5StickC@^0.2.5
	${common.lib_deps}
build_flags =
	${env.build_flags}
	-DSTICKC

[env:m5stick-c-plus]
board = m5stick-c
lib_deps = 
	m5stack/M5StickCPlus@^0.1.1
	${common.lib_deps}
build_flags =
	${env.build_flags}
	-DCPLUS
